# Print through the DK debugger's UART-to-USB bridge.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# PSA Crypto and random generation, using the installed Nordic integration.
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# Enable SHA-256 through the PSA Crypto API.
CONFIG_PSA_WANT_ALG_SHA_256=y

# Phase 3 only: unauthenticated AES-CTR encryption/decryption.
# AES key support is selected automatically by the SDK.
CONFIG_PSA_WANT_ALG_CTR=y

# Memory and tick settings from NCS 2.4.0's official crypto/rng sample.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=8192
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
