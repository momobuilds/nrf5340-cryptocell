<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Lesson 4: AES-128-CCM authenticates EMG samples</title>
  <desc id="desc">An educational flow diagram showing plaintext samples, additional authenticated data, a generated nonce, and a test key entering AES-128-CCM encryption. The output is ciphertext and an authentication tag. The receiver uses the same key, nonce, AAD, ciphertext, and tag to verify and decrypt the samples.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#102a43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#147d92"/>
    </marker>
    <marker id="goldArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#c48a18"/>
    </marker>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #102a43; }
      .subtitle { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486581; }
      .heading { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .body { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243b53; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #486581; }
      .mono { font: 600 16px Menlo, Monaco, monospace; fill: #243b53; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f6f8f7"/>
  <rect x="0" y="0" width="1400" height="18" fill="#147d92"/>
  <text x="70" y="82" class="title">Lesson 4: encrypt and authenticate the samples</text>
  <text x="70" y="120" class="subtitle">AES-128-CCM on the nRF5340: one operation hides the bytes and proves they were not changed.</text>

  <rect x="70" y="160" width="1260" height="315" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="205" class="heading">1. The board prepares one protected message</text>

  <rect x="105" y="240" width="285" height="170" rx="10" fill="#e7f5f7" stroke="#66b7c2" stroke-width="2"/>
  <text x="130" y="278" class="heading">Inputs</text>
  <text x="130" y="315" class="body">Plaintext: 8 samples</text>
  <text x="130" y="345" class="mono">16 bytes</text>
  <text x="130" y="378" class="body">AAD: visible header</text>
  <text x="130" y="404" class="mono">7 bytes</text>

  <path d="M405 325 H475" fill="none" stroke="#147d92" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="490" y="240" width="330" height="170" rx="10" fill="#fff7df" stroke="#d9a52e" stroke-width="2"/>
  <text x="515" y="278" class="heading">AES-128-CCM</text>
  <text x="515" y="313" class="body">PSA authenticated encryption</text>
  <text x="515" y="348" class="body">Random nonce generated</text>
  <text x="515" y="377" class="mono">13 bytes</text>
  <text x="515" y="402" class="body">Test key stays on board</text>

  <path d="M835 325 H905" fill="none" stroke="#147d92" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="920" y="240" width="365" height="170" rx="10" fill="#eaf3ec" stroke="#5b9b72" stroke-width="2"/>
  <text x="945" y="278" class="heading">Protected packet</text>
  <text x="945" y="318" class="body">Ciphertext: hidden samples</text>
  <text x="945" y="348" class="mono">16 bytes</text>
  <text x="945" y="378" class="body">Authentication tag</text>
  <text x="945" y="408" class="mono">16 bytes</text>

  <path d="M1102 430 V520" fill="none" stroke="#147d92" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="1118" y="483" class="small">packet crosses a transport</text>

  <rect x="70" y="545" width="1260" height="285" rx="12" fill="#ffffff" stroke="#d9e2ec" stroke-width="2" filter="url(#shadow)"/>
  <text x="105" y="590" class="heading">2. The receiver checks before using the recovered samples</text>

  <rect x="105" y="625" width="285" height="145" rx="10" fill="#fff7df" stroke="#d9a52e" stroke-width="2"/>
  <text x="130" y="663" class="heading">Same context</text>
  <text x="130" y="699" class="body">Key + nonce + AAD</text>
  <text x="130" y="733" class="body">ciphertext + tag</text>

  <path d="M405 697 H475" fill="none" stroke="#c48a18" stroke-width="4" marker-end="url(#goldArrow)"/>

  <rect x="490" y="625" width="330" height="145" rx="10" fill="#e7f5f7" stroke="#66b7c2" stroke-width="2"/>
  <text x="515" y="663" class="heading">psa_aead_decrypt()</text>
  <text x="515" y="700" class="body">Verifies the tag first</text>
  <text x="515" y="732" class="body">then releases plaintext</text>

  <path d="M835 697 H905" fill="none" stroke="#147d92" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="920" y="625" width="365" height="145" rx="10" fill="#eaf3ec" stroke="#5b9b72" stroke-width="2"/>
  <text x="945" y="663" class="heading">PASS: use samples</text>
  <text x="945" y="700" class="body">Recovered bytes match</text>
  <text x="945" y="732" class="mono">2010 2034 1995 ...</text>

  <text x="70" y="872" class="small">Important: the local memcmp() is only a teaching check. AEAD authentication does not need the original samples.</text>
</svg>
